<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VFF AI - Final Fix</title>
  
  <script src="https://unpkg.com/@google/generative-ai@0.1.0/dist/index.browser.js"></script>

  <style>
    :root { --bg: #0a0a0c; --acc: #6366f1; --txt: #f8fafc; }
    body { background: var(--bg); color: var(--txt); font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; }
    #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
    .msg { padding: 12px; border-radius: 15px; max-width: 85%; word-wrap: break-word; line-height: 1.5; font-size: 16px; }
    .user { align-self: flex-end; background: var(--acc); color: white; }
    .ai { align-self: flex-start; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.1); }
    .input-box { padding: 20px; background: #16161a; display: flex; gap: 10px; border-top: 1px solid #333; position: sticky; bottom: 0; }
    input { flex: 1; background: #000; border: 1px solid #444; color: #fff; padding: 12px; border-radius: 12px; outline: none; }
    button { background: var(--acc); border: none; color: #fff; padding: 10px 20px; border-radius: 12px; font-weight: bold; cursor: pointer; }
    button:disabled { opacity: 0.5; }
  </style>
</head>
<body>

  <div id="chat">
    <div class="msg ai"><b>VFF:</b> System Ready! Ab message type karke "Promote" dabayein.</div>
  </div>

  <div class="input-box">
    <input type="text" id="userInput" placeholder="Ask something...">
    <button id="promoteBtn">Promote</button>
  </div>

  <script>
    // Configuration
    const API_KEY = "AIzaSyAK1wZ4exTsISyL3vllmg0OQ44OG4N6nCE";

    const chatContainer = document.getElementById('chat');
    const inputField = document.getElementById('userInput');
    const btn = document.getElementById('promoteBtn');

    // Function to add message to UI
    function appendMessage(text, role) {
      const div = document.createElement('div');
      div.className = 'msg ' + role;
      div.innerHTML = (role === 'ai' ? '<b>VFF: </b>' : '') + text;
      chatContainer.appendChild(div);
      chatContainer.scrollTop = chatContainer.scrollHeight;
      return div;
    }

    // Main Promote Function
    async function startPromote() {
      const text = inputField.value.trim();
      if (!text) return;

      // 1. User Message dikhao
      appendMessage(text, 'user');
      inputField.value = '';
      
      // 2. Button disable karo
      btn.disabled = true;
      btn.innerText = "...";

      // 3. AI Placeholder
      const aiMsgDiv = appendMessage("Thinking...", 'ai');

      try {
        // Library check
        if (typeof window.GoogleGenerativeAI === 'undefined') {
          aiMsgDiv.innerText = "Error: Library load nahi hui. Network check karein.";
          return;
        }

        // Gemini Setup
        const genAI = new window.GoogleGenerativeAI.GoogleGenerativeAI(API_KEY);
        const model = genAI.getGenerativeModel({ model: "gemini-1.5-flash" });

        // Result mangwao
        const result = await model.generateContent(text);
        const response = await result.response;
        const aiText = response.text();

        // UI update karo
        aiMsgDiv.innerText = aiText;

      } catch (error) {
        console.error(error);
        aiMsgDiv.style.color = "red";
        aiMsgDiv.innerText = "Error: " + error.message;
      } finally {
        btn.disabled = false;
        btn.innerText = "Promote";
        chatContainer.scrollTop = chatContainer.scrollHeight;
      }
    }

    // Click Event
    btn.onclick = function() {
      startPromote();
    };

    // Enter Key Event
    inputField.onkeypress = function(e) {
      if (e.keyCode === 13) {
        startPromote();
      }
    };
  </script>
</body>
</html>
>
