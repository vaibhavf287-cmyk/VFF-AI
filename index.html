<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VFF | Ultimate Search</title>
  <style>
    :root { --bg: #0a0a0c; --acc: #3b82f6; --txt: #f8fafc; }
    body { background: var(--bg); color: var(--txt); font-family: sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    header { padding: 40px 20px; text-align: center; }
    .logo { font-size: 2.2rem; font-weight: 900; color: var(--acc); letter-spacing: -1px; }
    .container { width: 90%; max-width: 500px; }
    .image-box { 
      width: 100%; aspect-ratio: 16/9; background: #16161a; border-radius: 18px; 
      margin-bottom: 25px; display: flex; align-items: center; justify-content: center; 
      overflow: hidden; border: 1px solid #27272a; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    #res-img { width: 100%; height: 100%; object-fit: cover; display: none; }
    .loader { display: none; border: 3px solid #333; border-top-color: var(--acc); border-radius: 50%; width: 35px; height: 35px; animation: spin 0.8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .search-box { display: flex; background: #16161a; padding: 6px; border-radius: 14px; border: 1px solid #27272a; }
    input { flex: 1; background: transparent; border: none; color: white; padding: 12px; font-size: 1rem; outline: none; }
    button { background: var(--acc); color: white; border: none; padding: 12px 20px; border-radius: 10px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <header>
    <div class="logo">VFF SEARCH</div>
    <p style="color: #71717a;">Duniya ki har image, ab aapke paas.</p>
  </header>

  <div class="container">
    <div class="image-box">
      <div class="loader" id="loader"></div>
      <img id="res-img" src="" alt="VFF Result">
      <p id="placeholder" style="color: #3f3f46;">Type 'Nature' and Promote...</p>
    </div>

    <div class="search-box">
      <input type="text" id="query" placeholder="Search anything...">
      <button id="btn">Promote</button>
    </div>
  </div>

  <script>
    const btn = document.getElementById('btn');
    const input = document.getElementById('query');
    const img = document.getElementById('res-img');
    const loader = document.getElementById('loader');
    const placeholder = document.getElementById('placeholder');

    function searchImage() {
      const val = input.value.trim();
      if(!val) return;

      // Reset
      img.style.display = "none";
      placeholder.style.display = "none";
      loader.style.display = "block";
      btn.disabled = true;

      // Method: Unsplash Random Redirect (No API Key Required)
      // sig=random taaki har baar nayi image aaye
      const sig = Math.floor(Math.random() * 9999);
      const imageUrl = `https://images.unsplash.com/photo-1?auto=format&fit=crop&w=1080&q=80&query=${encodeURIComponent(val)}&sig=${sig}`;

      // Image loading logic
      const tempImg = new Image();
      tempImg.src = `https://source.unsplash.com/featured/?${encodeURIComponent(val)}&sig=${sig}`;
      
      // Kuch networks source.unsplash block karte hain, toh fallback URL:
      const fallbackUrl = `https://loremflickr.com/1080/720/${encodeURIComponent(val)}`;

      tempImg.onload = () => {
        img.src = tempImg.src;
        img.style.display = "block";
        loader.style.display = "none";
        btn.disabled = false;
      };

      tempImg.onerror = () => {
        // Fallback to LoremFlickr if Unsplash fails
        img.src = fallbackUrl;
        img.style.display = "block";
        loader.style.display = "none";
        btn.disabled = false;
      };
    }

    btn.onclick = searchImage;
    input.onkeydown = (e) => { if(e.key === 'Enter') searchImage(); };
  </script>
</body>
</html>
