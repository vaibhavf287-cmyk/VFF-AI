<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VFF AI</title>
  <script src="https://unpkg.com/@google/generative-ai@0.1.0/dist/index.browser.js"></script>
  <style>
    :root { --bg: #0a0a0c; --acc: #6366f1; --txt: #f8fafc; }
    body { background: var(--bg); color: var(--txt); font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; }
    #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
    .msg { padding: 12px; border-radius: 15px; max-width: 80%; word-wrap: break-word; }
    .user { align-self: flex-end; background: var(--acc); }
    .ai { align-self: flex-start; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.1); }
    .input-box { padding: 20px; background: #16161a; display: flex; gap: 10px; }
    input { flex: 1; background: #000; border: 1px solid #333; color: #fff; padding: 12px; border-radius: 10px; outline: none; }
    button { background: var(--acc); border: none; color: #fff; padding: 10px 20px; border-radius: 10px; font-weight: bold; cursor: pointer; }
    button:disabled { opacity: 0.5; }
  </style>
</head>
<body>
  <div id="chat"><div class="msg ai">Hello! I am VFF. How can I help you today?</div></div>
  <div class="input-box">
    <input type="text" id="in" placeholder="Type a message...">
    <button id="btn">Promote</button>
  </div>

  <script>
    // --- CONFIGURATION ---
    const API_KEY = "AIzaSyAK1wZ4exTsISyL3vllmg0OQ44OG4N6nCE"; 

    const chat = document.getElementById('chat');
    const input = document.getElementById('in');
    const btn = document.getElementById('btn');

    async function send() {
      const val = input.value.trim();
      if(!val) return;

      // User Message UI
      const uDiv = document.createElement('div');
      uDiv.className = 'msg user';
      uDiv.innerText = val;
      chat.appendChild(uDiv);
      
      input.value = '';
      btn.disabled = true;
      btn.innerText = "...";

      // AI Placeholder
      const aiDiv = document.createElement('div');
      aiDiv.className = 'msg ai';
      aiDiv.innerText = "Thinking...";
      chat.appendChild(aiDiv);
      chat.scrollTop = chat.scrollHeight;

      try {
        // Check if library loaded
        if (typeof window.GoogleGenerativeAI === 'undefined') {
            throw new Error("Library not loaded. Check internet.");
        }

        const genAI = new window.GoogleGenerativeAI.GoogleGenerativeAI(API_KEY);
        const model = genAI.getGenerativeModel({ model: "gemini-1.5-flash" });

        const result = await model.generateContent(val);
        const response = await result.response;
        aiDiv.innerText = response.text();
      } catch (err) {
        aiDiv.style.color = "red";
        aiDiv.innerText = "Error: " + err.message;
        console.error(err);
      } finally {
        btn.disabled = false;
        btn.innerText = "Promote";
        chat.scrollTop = chat.scrollHeight;
      }
    }

    btn.onclick = send;
    input.onkeydown = (e) => { if(e.key === 'Enter') send(); };
  </script>
</body>
</html>
