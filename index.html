<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VFF | Image Generator</title>
  <style>
    :root { --bg: #0f172a; --acc: #8b5cf6; --txt: #f8fafc; }
    body { background: var(--bg); color: var(--txt); font-family: 'Segoe UI', sans-serif; margin: 0; display: flex; flex-direction: column; min-height: 100vh; align-items: center; }
    
    header { padding: 2rem; text-align: center; }
    .logo { font-size: 2.5rem; font-weight: 800; background: linear-gradient(45deg, #a78bfa, #f472b6); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    
    .container { width: 90%; max-width: 600px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 20px; padding: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    
    .result-area { width: 100%; min-height: 300px; background: #000; border-radius: 15px; margin-bottom: 20px; display: flex; align-items: center; justify-content: center; overflow: hidden; border: 1px dashed #444; }
    #output-img { max-width: 100%; max-height: 100%; display: none; }
    .loader { color: var(--acc); font-weight: bold; display: none; }

    .input-group { display: flex; flex-direction: column; gap: 10px; }
    textarea { background: #1e293b; border: 1px solid #334155; color: white; padding: 15px; border-radius: 12px; resize: none; font-size: 1rem; outline: none; }
    textarea:focus { border-color: var(--acc); }
    
    button { background: var(--acc); color: white; border: none; padding: 15px; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 1.1rem; transition: 0.3s; }
    button:hover { background: #7c3aed; }
    button:disabled { background: #444; cursor: not-allowed; }
  </style>
</head>
<body>

  <header>
    <div class="logo">VFF Imagine</div>
    <p>Apni soch ko tasveer mein badlein</p>
  </header>

  <div class="container">
    <div class="result-area">
      <div class="loader" id="loader">VFF is painting... (30-40 seconds)</div>
      <img id="output-img" src="" alt="Generated Image">
      <p id="placeholder-text" style="color: #64748b;">Aapki image yahan dikhegi</p>
    </div>

    <div class="input-group">
      <textarea id="prompt" rows="3" placeholder="Example: A futuristic city with flying cars, cinematic lighting, 8k..."></textarea>
      <button id="genBtn">Generate Magic</button>
    </div>
  </div>

  <script>
    // --- Stable Diffusion API ---
    // Bhai maine isme apni key temporary bypass ke liye daal di hai
    const API_TOKEN = "hf_VnZpEwLpIqYwXzNkJvRmTpA"; 

    const genBtn = document.getElementById('genBtn');
    const promptInput = document.getElementById('prompt');
    const outputImg = document.getElementById('output-img');
    const loader = document.getElementById('loader');
    const placeholder = document.getElementById('placeholder-text');

    async function generateImage() {
        const text = promptInput.value.trim();
        if (!text) {
            alert("Kuch toh likho bhai!");
            return;
        }

        // UI Reset
        genBtn.disabled = true;
        genBtn.innerText = "Generating...";
        loader.style.display = "block";
        outputImg.style.display = "none";
        placeholder.style.display = "none";

        try {
            const response = await fetch(
                "https://api-inference.huggingface.co/models/stabilityai/stable-diffusion-2-1",
                {
                    headers: { Authorization: `Bearer ${API_TOKEN}` },
                    method: "POST",
                    body: JSON.stringify({ inputs: text }),
                }
            );

            if (!response.ok) throw new Error("API busy or error");

            const blob = await response.blob();
            const imgUrl = URL.createObjectURL(blob);
            
            outputImg.src = imgUrl;
            outputImg.style.display = "block";
        } catch (error) {
            alert("Error: Server busy hai, ek baar phir try karein.");
            placeholder.style.display = "block";
        } finally {
            genBtn.disabled = false;
            genBtn.innerText = "Generate Magic";
            loader.style.display = "none";
        }
    }

    genBtn.onclick = generateImage;
  </script>
</body>
</html>
