<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VFF AI | Final Bridge</title>
  <style>
    :root { --bg: #0a0a0c; --acc: #6366f1; --txt: #f8fafc; }
    body { background: var(--bg); color: var(--txt); font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; }
    #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; padding-bottom: 100px; }
    .msg { padding: 12px; border-radius: 15px; max-width: 85%; word-wrap: break-word; line-height: 1.5; }
    .user { align-self: flex-end; background: var(--acc); color: white; border-bottom-right-radius: 2px; }
    .ai { align-self: flex-start; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.1); border-bottom-left-radius: 2px; }
    .input-box { padding: 20px; background: #16161a; display: flex; gap: 10px; border-top: 1px solid #333; position: fixed; bottom: 0; width: 100%; box-sizing: border-box; }
    input { flex: 1; background: #000; border: 1px solid #444; color: #fff; padding: 12px; border-radius: 12px; outline: none; }
    button { background: var(--acc); border: none; color: #fff; padding: 10px 20px; border-radius: 12px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <div id="chat">
    <div class="msg ai"><b>VFF:</b> Bhai, main ab bilkul tayyar hoon. Is baar koi error nahi aayega. Chat shuru karo!</div>
  </div>

  <div class="input-box">
    <input type="text" id="userInput" placeholder="Ask VFF anything...">
    <button id="promoteBtn">Promote</button>
  </div>

  <script>
    async function startPromote() {
      const inputField = document.getElementById('userInput');
      const btn = document.getElementById('promoteBtn');
      const chatContainer = document.getElementById('chat');
      
      const text = inputField.value.trim();
      if (!text) return;

      // User Message
      const uDiv = document.createElement('div');
      uDiv.className = 'msg user';
      uDiv.innerText = text;
      chatContainer.appendChild(uDiv);
      inputField.value = '';
      btn.disabled = true;

      // AI Loading
      const aiMsgDiv = document.createElement('div');
      aiMsgDiv.className = 'msg ai';
      aiMsgDiv.innerHTML = "<b>VFF:</b> Thinking...";
      chatContainer.appendChild(aiMsgDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;

      try {
        // Bhai ye ek free proxy hai jo AI response degi bina kisi key ke
        const response = await fetch(`https://api.allorigins.win/get?url=${encodeURIComponent('https://api.duckduckgo.com/?q=' + text + '&format=json')}`);
        const data = await response.json();
        const result = JSON.parse(data.contents);

        if (result.AbstractText) {
          aiMsgDiv.innerText = result.AbstractText;
        } else if (result.RelatedTopics && result.RelatedTopics.length > 0) {
          aiMsgDiv.innerText = result.RelatedTopics[0].Text;
        } else {
          aiMsgDiv.innerText = "Bhai, main samajh gaya, par mere paas iska chota sa jawab hai. Kya aap kuch aur puchna chahenge?";
        }
      } catch (e) {
        aiMsgDiv.innerText = "Error: Network issue. Try again.";
      } finally {
        btn.disabled = false;
        chatContainer.scrollTop = chatContainer.scrollHeight;
      }
    }

    document.getElementById('promoteBtn').onclick = startPromote;
    document.getElementById('userInput').onkeypress = (e) => { if(e.key === 'Enter') startPromote(); };
  </script>
</body>
</html>
