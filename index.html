<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VFF | Ultra Image</title>
  <style>
    :root { --bg: #09090b; --acc: #6366f1; --txt: #fafafa; }
    body { background: var(--bg); color: var(--txt); font-family: -apple-system, BlinkMacSystemFont, sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    header { padding: 40px 20px; text-align: center; }
    .logo { font-size: 2.5rem; font-weight: 800; color: var(--acc); }
    .container { width: 90%; max-width: 500px; padding-bottom: 50px; }
    .image-box { 
      width: 100%; aspect-ratio: 1/1; background: #18181b; border-radius: 24px; 
      margin-bottom: 25px; display: flex; align-items: center; justify-content: center; 
      overflow: hidden; border: 1px solid #27272a; 
    }
    #res-img { width: 100%; height: 100%; object-fit: cover; display: none; }
    .spinner { display: none; border: 4px solid #27272a; border-top-color: var(--acc); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .search-area { display: flex; flex-direction: column; gap: 15px; }
    input { background: #18181b; border: 1px solid #27272a; color: white; padding: 18px; border-radius: 16px; font-size: 1rem; outline: none; transition: 0.3s; }
    input:focus { border-color: var(--acc); }
    button { background: var(--acc); color: white; border: none; padding: 18px; border-radius: 16px; font-weight: bold; cursor: pointer; font-size: 1.1rem; }
  </style>
</head>
<body>

  <header>
    <div class="logo">VFF SEARCH</div>
    <p style="color: #a1a1aa;">Unlimited images from Pixabay</p>
  </header>

  <div class="container">
    <div class="image-box">
      <div class="spinner" id="loader"></div>
      <img id="res-img" src="" alt="VFF Result">
      <p id="msg" style="color: #52525b; text-align: center;">Khojiye duniya ki koi bhi tasveer...</p>
    </div>

    <div class="search-area">
      <input type="text" id="query" placeholder="Type here (e.g. BMW, Space, Ocean)">
      <button id="btn">Promote</button>
    </div>
  </div>

  <script>
    const btn = document.getElementById('btn');
    const input = document.getElementById('query');
    const img = document.getElementById('res-img');
    const loader = document.getElementById('loader');
    const msg = document.getElementById('msg');

    // Pixabay API Key (Stable for millions of images)
    const PIXABAY_KEY = '48831034-453715c02931109a259c77c61'; 

    async function findImage() {
      const val = input.value.trim();
      if(!val) return;

      img.style.display = "none";
      msg.style.display = "none";
      loader.style.display = "block";
      btn.disabled = true;

      try {
        const response = await fetch(`https://pixabay.com/api/?key=${PIXABAY_KEY}&q=${encodeURIComponent(val)}&image_type=photo&per_page=3&safesearch=true`);
        const data = await response.json();

        if (data.hits && data.hits.length > 0) {
          // Pehli achhi quality wali image uthao
          const imageUrl = data.hits[0].largeImageURL;
          
          const tempImg = new Image();
          tempImg.src = imageUrl;
          tempImg.onload = () => {
            img.src = imageUrl;
            img.style.display = "block";
            loader.style.display = "none";
            btn.disabled = false;
          };
        } else {
          throw new Error("No images found");
        }
      } catch (e) {
        loader.style.display = "none";
        msg.innerText = "Error: Image nahi mili. Dusra word likhein.";
        msg.style.display = "block";
        btn.disabled = false;
      }
    }

    btn.onclick = findImage;
    input.onkeydown = (e) => { if(e.key === 'Enter') findImage(); };
  </script>
</body>
</html>
