<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VFF AI - Fixed</title>
  
  <script src="https://cdn.jsdelivr.net/npm/@google/generative-ai@0.1.0/dist/index.browser.min.js"></script>
  
  <style>
    :root { --bg: #0a0a0c; --acc: #6366f1; --txt: #f8fafc; }
    body { background: var(--bg); color: var(--txt); font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; }
    #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; }
    .msg { padding: 12px; border-radius: 15px; max-width: 80%; word-wrap: break-word; line-height: 1.5; }
    .user { align-self: flex-end; background: var(--acc); box-shadow: 0 4px 10px rgba(99, 102, 241, 0.3); }
    .ai { align-self: flex-start; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.1); }
    .input-box { padding: 20px; background: #16161a; display: flex; gap: 10px; border-top: 1px solid #333; }
    input { flex: 1; background: #000; border: 1px solid #444; color: #fff; padding: 12px; border-radius: 12px; outline: none; }
    button { background: var(--acc); border: none; color: #fff; padding: 10px 22px; border-radius: 12px; font-weight: bold; cursor: pointer; transition: 0.2s; }
    button:active { transform: scale(0.95); }
    button:disabled { background: #444; cursor: not-allowed; }
  </style>
</head>
<body>

  <div id="chat">
    <div class="msg ai"><b>VFF:</b> Library load ho rahi hai... Agar yahan message change nahi hota, toh internet check karein.</div>
  </div>

  <div class="input-box">
    <input type="text" id="in" placeholder="Ask me something...">
    <button id="btn">Promote</button>
  </div>

  <script>
    // --- API CONFIG ---
    const API_KEY = "AIzaSyAK1wZ4exTsISyL3vllmg0OQ44OG4N6nCE"; //

    const chat = document.getElementById('chat');
    const input = document.getElementById('in');
    const btn = document.getElementById('btn');

    // Check if library is ready
    window.onload = () => {
        if (typeof window.GoogleGenerativeAI !== 'undefined') {
            chat.innerHTML = '<div class="msg ai"><b>VFF:</b> System Ready! Ab aap "Promote" kar sakte hain.</div>';
        } else {
            chat.innerHTML = '<div class="msg ai" style="color: #ff4444;"><b>Error:</b> Library load nahi hui. Ek baar page refresh karein ya Chrome browser use karein.</div>';
        }
    };

    async function send() {
      const val = input.value.trim();
      if(!val) return;

      // User Message
      const uDiv = document.createElement('div');
      uDiv.className = 'msg user';
      uDiv.innerText = val;
      chat.appendChild(uDiv);
      
      input.value = '';
      btn.disabled = true;
      btn.innerText = "...";

      // AI Placeholder
      const aiDiv = document.createElement('div');
      aiDiv.className = 'msg ai';
      aiDiv.innerHTML = "<b>VFF:</b> Thinking...";
      chat.appendChild(aiDiv);
      chat.scrollTop = chat.scrollHeight;

      try {
        if (typeof window.GoogleGenerativeAI === 'undefined') {
            throw new Error("Library connection blocked. Browser badal kar dekhein.");
        }

        const genAI = new window.GoogleGenerativeAI.GoogleGenerativeAI(API_KEY);
        const model = genAI.getGenerativeModel({ 
            model: "gemini-1.5-flash"
        });

        const result = await model.generateContent(val);
        const response = await result.response;
        aiDiv.innerText = response.text();

      } catch (err) {
        aiDiv.style.color = "#ff4444";
        aiDiv.innerText = "Error: " + err.message;
        console.error("DEBUG:", err);
      } finally {
        btn.disabled = false;
        btn.innerText = "Promote";
        chat.scrollTop = chat.scrollHeight;
      }
    }

    btn.onclick = send;
    input.onkeydown = (e) => { if(e.key === 'Enter') send(); };
  </script>
</body>
</html>
