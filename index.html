<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VFF | Image Library</title>
  <style>
    :root { --bg: #050505; --acc: #6366f1; --txt: #ffffff; }
    body { background: var(--bg); color: var(--txt); font-family: sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    
    header { padding: 30px; text-align: center; }
    .logo { font-size: 2.2rem; font-weight: 900; color: var(--acc); text-transform: uppercase; }

    .container { width: 92%; max-width: 500px; }

    .display-card { 
      width: 100%; 
      aspect-ratio: 1/1; 
      background: #111; 
      border-radius: 20px; 
      margin-bottom: 25px; 
      display: flex; 
      align-items: center; 
      justify-content: center; 
      overflow: hidden; 
      border: 1px solid #222;
      position: relative;
    }
    
    #res-img { width: 100%; height: 100%; object-fit: cover; display: none; }
    .loader { display: none; width: 40px; height: 40px; border: 4px solid #222; border-top-color: var(--acc); border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .search-box { display: flex; flex-direction: column; gap: 12px; }
    input { background: #1a1a1a; border: 1px solid #333; color: white; padding: 15px; border-radius: 12px; font-size: 1rem; outline: none; }
    input:focus { border-color: var(--acc); }
    button { background: var(--acc); color: white; border: none; padding: 15px; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 1.1rem; }
    button:disabled { opacity: 0.6; }
  </style>
</head>
<body>

  <header>
    <div class="logo">VFF Image Finder</div>
    <p style="color: #666;">Duniya ki koi bhi image dhoondhein</p>
  </header>

  <div class="container">
    <div class="display-card">
      <div class="loader" id="loader"></div>
      <img id="res-img" src="" alt="VFF Result">
      <p id="msg" style="color: #444; text-align: center; padding: 20px;">Describe image & click Promote</p>
    </div>

    <div class="search-box">
      <input type="text" id="query" placeholder="Search (e.g. Red Lamborghini, Galaxy, Tiger)">
      <button id="btn">Promote</button>
    </div>
  </div>

  <script>
    const btn = document.getElementById('btn');
    const input = document.getElementById('query');
    const img = document.getElementById('res-img');
    const loader = document.getElementById('loader');
    const msg = document.getElementById('msg');

    function findImage() {
      const val = input.value.trim();
      if(!val) return;

      // Reset UI
      img.style.display = "none";
      msg.style.display = "none";
      loader.style.display = "block";
      btn.disabled = true;
      btn.innerText = "Searching...";

      // Pollinations AI ka naya aur stable rasta
      const seed = Math.floor(Math.random() * 10000);
      const imageUrl = `https://image.pollinations.ai/prompt/${encodeURIComponent(val)}?seed=${seed}&width=1024&height=1024&nologo=true`;

      // Browser ko image load karne ka signal dena
      const tempImg = new Image();
      tempImg.src = imageUrl;

      tempImg.onload = () => {
        img.src = imageUrl;
        img.style.display = "block";
        loader.style.display = "none";
        btn.disabled = false;
        btn.innerText = "Promote";
      };

      tempImg.onerror = () => {
        loader.style.display = "none";
        msg.innerText = "Error: Check your connection.";
        msg.style.display = "block";
        btn.disabled = false;
        btn.innerText = "Promote";
      };
    }

    btn.onclick = findImage;
    input.onkeydown = (e) => { if(e.key === 'Enter') findImage(); };
  </script>
</body>
</html>
