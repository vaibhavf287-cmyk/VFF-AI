<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VFF AI | Smart Mode</title>
  <style>
    :root { --bg: #0a0a0c; --acc: #6366f1; --txt: #f8fafc; }
    body { background: var(--bg); color: var(--txt); font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; }
    #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; padding-bottom: 100px; }
    .msg { padding: 12px; border-radius: 15px; max-width: 85%; word-wrap: break-word; line-height: 1.5; }
    .user { align-self: flex-end; background: var(--acc); color: white; }
    .ai { align-self: flex-start; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.1); }
    .input-box { padding: 20px; background: #16161a; display: flex; gap: 10px; border-top: 1px solid #333; position: fixed; bottom: 0; width: 100%; box-sizing: border-box; }
    input { flex: 1; background: #000; border: 1px solid #444; color: #fff; padding: 12px; border-radius: 12px; outline: none; }
    button { background: var(--acc); border: none; color: #fff; padding: 10px 20px; border-radius: 12px; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <div id="chat">
    <div class="msg ai"><b>VFF:</b> Smart System Ready! Main ab best model dhoond kar chat karunga.</div>
  </div>

  <div class="input-box">
    <input type="text" id="userInput" placeholder="Kuch bhi puchiye...">
    <button id="promoteBtn">Promote</button>
  </div>

  <script>
    const API_KEY = "AIzaSyAK1wZ4exTsISyL3vllmg0OQ44OG4N6nCE";
    
    // List of possible URLs to try
    const endPoints = [
      "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent",
      "https://generativelanguage.googleapis.com/v1beta/models/gemini-pro:generateContent",
      "https://generativelanguage.googleapis.com/v1/models/gemini-pro:generateContent"
    ];

    async function startPromote() {
      const inputField = document.getElementById('userInput');
      const btn = document.getElementById('promoteBtn');
      const chatContainer = document.getElementById('chat');
      
      const text = inputField.value.trim();
      if (!text) return;

      const uDiv = document.createElement('div');
      uDiv.className = 'msg user';
      uDiv.innerText = text;
      chatContainer.appendChild(uDiv);
      
      inputField.value = '';
      btn.disabled = true;

      const aiMsgDiv = document.createElement('div');
      aiMsgDiv.className = 'msg ai';
      aiMsgDiv.innerHTML = "<b>VFF:</b> Scanning models...";
      chatContainer.appendChild(aiMsgDiv);

      let success = false;

      // Loop through each endpoint until one works
      for (let url of endPoints) {
        try {
          const response = await fetch(`${url}?key=${API_KEY}`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ contents: [{ parts: [{ text: text }] }] })
          });

          const data = await response.json();

          if (data.candidates && data.candidates[0].content.parts[0].text) {
            aiMsgDiv.innerText = data.candidates[0].content.parts[0].text;
            success = true;
            break; // Stop loop if successful
          }
        } catch (e) {
          console.log("Failed with: " + url);
        }
      }

      if (!success) {
        aiMsgDiv.innerText = "Error: Google is rejecting all models. Please check your API Key in Google AI Studio.";
      }

      btn.disabled = false;
      chatContainer.scrollTop = chatContainer.scrollHeight;
    }

    document.getElementById('promoteBtn').onclick = startPromote;
  </script>
</body>
</html>
