<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VFF AI | Direct Mode</title>
  <style>
    :root { --bg: #0a0a0c; --acc: #6366f1; --txt: #f8fafc; }
    body { background: var(--bg); color: var(--txt); font-family: sans-serif; margin: 0; display: flex; flex-direction: column; height: 100vh; }
    #chat { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 15px; padding-bottom: 100px; }
    .msg { padding: 12px; border-radius: 15px; max-width: 85%; word-wrap: break-word; line-height: 1.5; font-size: 16px; }
    .user { align-self: flex-end; background: var(--acc); color: white; }
    .ai { align-self: flex-start; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.1); }
    .input-box { padding: 20px; background: #16161a; display: flex; gap: 10px; border-top: 1px solid #333; position: fixed; bottom: 0; width: 100%; box-sizing: border-box; }
    input { flex: 1; background: #000; border: 1px solid #444; color: #fff; padding: 12px; border-radius: 12px; outline: none; }
    button { background: var(--acc); border: none; color: #fff; padding: 10px 20px; border-radius: 12px; font-weight: bold; cursor: pointer; }
    button:disabled { opacity: 0.5; }
  </style>
</head>
<body>

  <div id="chat">
    <div class="msg ai"><b>VFF:</b> Ready! Ab seedha chat shuru karein. (Direct Mode)</div>
  </div>

  <div class="input-box">
    <input type="text" id="userInput" placeholder="Ask VFF something...">
    <button id="promoteBtn">Promote</button>
  </div>

  <script>
    const API_KEY = "AIzaSyAK1wZ4exTsISyL3vllmg0OQ44OG4N6nCE";
    const API_URL = "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=" + API_KEY;

    const chatContainer = document.getElementById('chat');
    const inputField = document.getElementById('userInput');
    const btn = document.getElementById('promoteBtn');

    function appendMessage(text, role) {
      const div = document.createElement('div');
      div.className = 'msg ' + role;
      div.innerHTML = (role === 'ai' ? '<b>VFF: </b>' : '') + text;
      chatContainer.appendChild(div);
      chatContainer.scrollTop = chatContainer.scrollHeight;
      return div;
    }

    async function startPromote() {
      const text = inputField.value.trim();
      if (!text) return;

      appendMessage(text, 'user');
      inputField.value = '';
      btn.disabled = true;
      btn.innerText = "...";

      const aiMsgDiv = appendMessage("Thinking...", 'ai');

      try {
        // Direct API Call without any library
        const response = await fetch(API_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{ parts: [{ text: text }] }]
          })
        });

        const data = await response.json();
        
        if (data.candidates && data.candidates[0].content.parts[0].text) {
          aiMsgDiv.innerText = data.candidates[0].content.parts[0].text;
        } else {
          aiMsgDiv.innerText = "Error: API ne response nahi diya.";
        }

      } catch (error) {
        aiMsgDiv.style.color = "red";
        aiMsgDiv.innerText = "Connection Error. Check Internet.";
      } finally {
        btn.disabled = false;
        btn.innerText = "Promote";
        chatContainer.scrollTop = chatContainer.scrollHeight;
      }
    }

    btn.onclick = startPromote;
    inputField.onkeypress = (e) => { if (e.keyCode === 13) startPromote(); };
  </script>
</body>
</html>
