<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VFF | Virtual Fast Friend</title>
  <style>
    :root { --bg-color: #0a0a0c; --glass-bg: rgba(255, 255, 255, 0.05); --glass-border: rgba(255, 255, 255, 0.1); --accent-color: #6366f1; --text-main: #f8fafc; --text-dim: #94a3b8; }
    body { background-color: var(--bg-color); color: var(--text-main); font-family: sans-serif; margin: 0; display: flex; height: 100vh; overflow: hidden; }
    #app { display: flex; flex-direction: column; width: 100%; max-width: 900px; margin: 0 auto; position: relative; }
    header { padding: 1.5rem; display: flex; justify-content: space-between; align-items: center; }
    .logo { font-weight: 800; font-size: 1.5rem; background: linear-gradient(to right, #818cf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .dot { width: 8px; height: 8px; background-color: #22c55e; border-radius: 50%; box-shadow: 0 0 8px #22c55e; }
    #chat-container { flex: 1; overflow-y: auto; padding: 1rem 1.5rem 10rem 1.5rem; display: flex; flex-direction: column; gap: 1.5rem; }
    .message { max-width: 85%; padding: 1rem; border-radius: 1.25rem; line-height: 1.6; word-wrap: break-word; }
    .user { align-self: flex-end; background-color: var(--accent-color); color: white; border-bottom-right-radius: 0.25rem; }
    .ai { align-self: flex-start; background-color: var(--glass-bg); border: 1px solid var(--glass-border); border-bottom-left-radius: 0.25rem; }
    .input-area { position: absolute; bottom: 0; left: 0; right: 0; padding: 2rem; background: linear-gradient(to top, var(--bg-color) 70%, transparent); }
    .input-wrapper { background: var(--glass-bg); border: 1px solid var(--glass-border); border-radius: 1.5rem; padding: 0.5rem 1rem; display: flex; gap: 10px; }
    textarea { flex: 1; background: transparent; border: none; color: white; outline: none; font-size: 1rem; resize: none; padding: 10px 0; }
    #send-btn { background: var(--accent-color); border: none; color: white; padding: 10px 20px; border-radius: 1rem; cursor: pointer; font-weight: bold; }
  </style>
  <script type="importmap"> { "imports": { "@google/genai": "https://esm.sh/@google/genai@^0.7.0" } } </script>
</head>
<body>
  <div id="app">
    <header>
      <div class="logo">VFF</div>
      <div class="status-indicator"><span class="dot"></span> <span class="status-text">Ready</span></div>
    </header>
    <main id="chat-container">
      <div class="welcome-message" style="text-align:center; margin-top:20vh;">
        <h1>Hello. I'm VFF.</h1>
        <p style="color:var(--text-dim);">Chat with me now.</p>
      </div>
    </main>
    <footer class="input-area">
      <div class="input-wrapper">
        <textarea id="user-input" placeholder="Promote a thought..." rows="1"></textarea>
        <button id="send-btn">Promote</button>
      </div>
    </footer>
  </div>
  <script type="module">
    import { GoogleGenAI } from '@google/genai';
    const API_KEY = "AIzaSyAK1wZ4exTsISyL3vllmg0OQ44OG4N6nCE";
    const genAI = new GoogleGenAI(API_KEY);
    const chatContainer = document.getElementById('chat-container');
    const userInput = document.getElementById('user-input');
    const sendBtn = document.getElementById('send-btn');
    const statusText = document.querySelector('.status-text');

    async function promote() {
      const text = userInput.value.trim();
      if (!text) return;
      userInput.value = '';
      statusText.textContent = 'Thinking...';
      const userDiv = document.createElement('div');
      userDiv.className = 'message user';
      userDiv.innerText = text;
      chatContainer.appendChild(userDiv);
      const aiDiv = document.createElement('div');
      aiDiv.className = 'message ai';
      aiDiv.innerText = '...';
      chatContainer.appendChild(aiDiv);
      chatContainer.scrollTop = chatContainer.scrollHeight;
      try {
        const model = genAI.getGenerativeModel({ model: "gemini-1.5-flash" });
        const result = await model.generateContent(text);
        aiDiv.innerText = result.response.text();
      } catch (e) { aiDiv.innerText = "Error: API Key check karein."; }
      finally { statusText.textContent = 'Ready'; chatContainer.scrollTop = chatContainer.scrollHeight; }
    }
    sendBtn.onclick = promote;
  </script>
</body>
</html>
